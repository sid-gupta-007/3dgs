# PanoGS Default Configuration
# Tailored for local CPU development with memory safety

hardware:
  device: cpu
  num_threads: 4
  max_memory_gb: 12.0

image:
  max_resolution: 1024
  normalize_to_float: true
  supported_formats:
    - .jpg
    - .jpeg
    - .png

reconstruction:
  resolution: 512
  max_gaussians: 50000
  iterations: 1000
